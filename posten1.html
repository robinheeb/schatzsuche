<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>🌳 Posten 1 – Der Baum</title>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#ui-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 999;
    pointer-events: none;
}

#header {
    background: linear-gradient(135deg,#2d6a4f,#40916c);
    color: white;
    text-align: center;
    padding: 10px;
    pointer-events: all;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
}

#header h1 {
    margin: 0;
    font-size: 1rem;
}

#header p {
    margin: 4px 0 0;
    font-size: 0.8rem;
}

#marker-hint {
    position: fixed;
    top: 22%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 14px 20px;
    border-radius: 14px;
    text-align: center;
    z-index: 500;
}

#raetsel-box {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg,#fff9c4,#fff176);
    border-top: 4px solid #f9a825;
    padding: 14px;
    z-index: 999;
    max-height: 38vh;
    overflow-y: auto;
}

#raetsel-box h2 {
    margin: 0 0 10px;
    color: #5d4037;
}

#raetsel-box p {
    margin: 0 0 14px;
    line-height: 1.4;
}

.answer-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.answer-btn {
    background: #4caf50;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
}

.answer-btn.wrong {
    background: #d32f2f;
}

#feedback {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 2000;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    padding: 30px;
}

#feedback.show {
    display: flex;
}

#feedback .emoji {
    font-size: 5rem;
}

#feedback h2 {
    color: white;
}

#feedback p {
    color: white;
    max-width: 500px;
}

#feedback button {
    background: #4caf50;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px 24px;
    font-size: 1rem;
}
</style>
</head>

<body>

<a-scene
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true;"
    device-orientation-permission-ui="enabled: false"
    arjs="trackingMethod: best;
          sourceType: webcam;
          debugUIEnabled: false;">

<a-assets>
    <a-asset-item id="squirrel"
        src="Squirrel.glb">
    </a-asset-item>
</a-assets>

      <a-marker
    type="pattern"
    url="squirrelmarker.patt"
    id="marker1">

    <!-- Reihe hinten -->

    <a-entity position="-0.8 0 -0.7">
        <a-gltf-model src="#squirrel"
                      scale="0.003 0.003 0.003"
                      rotation="0 160 0">
        </a-gltf-model>
    </a-entity>

    <a-entity position="-0.25 0 -0.7">
        <a-gltf-model src="#squirrel"
                      scale="0.003 0.003 0.003"
                      rotation="0 195 0">
        </a-gltf-model>
    </a-entity>

    <a-entity position="0.25 0 -0.7">
        <a-gltf-model src="#squirrel"
                      scale="0.003 0.003 0.003"
                      rotation="0 145 0">
        </a-gltf-model>
    </a-entity>

    <a-entity position="0.8 0 -0.7">
        <a-gltf-model src="#squirrel"
                      scale="0.003 0.003 0.003"
                      rotation="0 220 0">
        </a-gltf-model>
    </a-entity>

    <!-- Reihe Mitte -->

    <a-entity position="-1.0 0 0">
        <a-gltf-model src="#squirrel"
                      scale="0.003 0.003 0.003"
                      rotation="0 180 0">
        </a-gltf-model>
    </a-entity>

    <a-entity position="-0.35 0 0">
        <a-gltf-model src="#squirrel"
                      scale="0.003 0.003 0.003"
                      rotation="0 135 0">
        </a-gltf-model>
    </a-entity>

    <a-entity position="0.35 0 0">
        <a-gltf-model src="#squirrel"
                      scale="0.003 0.003 0.003"
                      rotation="0 210 0">
        </a-gltf-model>
    </a-entity>

    <a-entity position="1.0 0 0">
        <a-gltf-model src="#squirrel"
                      scale="0.003 0.003 0.003"
                      rotation="0 150 0">
        </a-gltf-model>
    </a-entity>

    <!-- Reihe vorne -->

    <a-entity position="-0.45 0 0.7">
        <a-gltf-model src="#squirrel"
                      scale="0.003 0.003 0.003"
                      rotation="0 170 0">
        </a-gltf-model>
    </a-entity>

    <a-entity position="0.45 0 0.7">
        <a-gltf-model src="#squirrel"
                      scale="0.003 0.003 0.003"
                      rotation="0 200 0">
        </a-gltf-model>
    </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<div id="marker-hint">
📋 Halte die Kamera auf den HIRO-Marker
</div>

<div id="ui-overlay">
    <div id="header">
        <h1>🌳 Posten 1 – Der Baum</h1>
        <p>Finde die Eichhörnchen mit den Nüssen</p>
    </div>
</div>

<div id="raetsel-box">
    <h2>🐿️ Rätsel</h2>

    <p>
        Schaue ganz genau hin!<br>
        Wie viele Eichhörnchen tragen eine Nuss?
    </p>

    <div class="answer-grid">
        <button class="answer-btn" onclick="checkAnswer(this,false)">5</button>
        <button class="answer-btn" onclick="checkAnswer(this,false)">6</button>
        <button class="answer-btn" onclick="checkAnswer(this,true)">7</button>
        <button class="answer-btn" onclick="checkAnswer(this,false)">8</button>
    </div>
</div>

<div id="feedback">
    <div class="emoji" id="feedback-emoji">🎉</div>
    <h2 id="feedback-title">Richtig!</h2>
    <p id="feedback-text">
        Richtig! 7 Eichhörnchen tragen eine Nuss.
        Suche nun den nächsten Hinweis beim grossen Stein.
    </p>
    <button onclick="hideFeedback()">Weiter</button>
</div>

const marker = document.querySelector('#marker1');

</script>

</body>
</html>
