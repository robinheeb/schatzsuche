<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌳 Posten 1 – Der Baum</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Arial Rounded MT Bold', Arial, sans-serif; }

    #ui-overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 999;
      pointer-events: none;
    }

    #header {
      background: linear-gradient(135deg, #2d6a4f, #40916c);
      color: white;
      text-align: center;
      padding: 12px 16px;
      pointer-events: all;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    }

    #header h1 { margin: 0; font-size: 1.1em; }
    #header p  { margin: 4px 0 0; font-size: 0.8em; opacity: 0.9; }

    #raetsel-box {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(135deg, #fff9c4, #fff176);
      border-top: 4px solid #f9a825;
      padding: 16px 20px 24px;
      pointer-events: all;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
    }

    #raetsel-box h2 {
      margin: 0 0 10px;
      font-size: 1em;
      color: #5d4037;
    }

    #raetsel-box p {
      margin: 0 0 14px;
      font-size: 1.05em;
      color: #3e2723;
      line-height: 1.4;
    }

    .answer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .answer-btn {
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }

    .answer-btn:active { transform: scale(0.95); }
    .answer-btn.wrong  { background: #ef5350; }

    #feedback {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 30px;
    }

    #feedback.show { display: flex; }

    #feedback .emoji { font-size: 5em; margin-bottom: 16px; }
    #feedback h2    { color: white; font-size: 1.6em; margin: 0 0 10px; }
    #feedback p     { color: #eee; font-size: 1em; margin: 0 0 24px; }

    #feedback button {
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 30px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
    }

    #marker-hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.6);
      color: white;
      border-radius: 16px;
      padding: 16px 24px;
      text-align: center;
      font-size: 0.9em;
      pointer-events: none;
      z-index: 500;
    }
  </style>
</head>
<body>

  <!-- AR Szene -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
  >
    <!-- HIRO Marker: Eichhörnchen (3D-Figur aus einfachen Formen) -->
    <a-marker preset="hiro" id="marker1">

      <!-- Körper -->
      <a-sphere position="0 0.5 0" radius="0.35" color="#c0720c"
        animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear">
      </a-sphere>

      <!-- Kopf -->
      <a-sphere position="0 1.0 0" radius="0.22" color="#c0720c"></a-sphere>

      <!-- Augen -->
      <a-sphere position="-0.08 1.08 0.18" radius="0.05" color="black"></a-sphere>
      <a-sphere position="0.08 1.08 0.18" radius="0.05" color="black"></a-sphere>

      <!-- Nase -->
      <a-sphere position="0 1.0 0.22" radius="0.04" color="#5d3a1a"></a-sphere>

      <!-- Ohren -->
      <a-cone position="-0.14 1.22 0" radius-bottom="0.07" radius-top="0.01" height="0.18" color="#c0720c" rotation="0 0 -20"></a-cone>
      <a-cone position="0.14 1.22 0" radius-bottom="0.07" radius-top="0.01" height="0.18" color="#c0720c" rotation="0 0 20"></a-cone>

      <!-- Schwanz (große geschwungene Form) -->
      <a-torus position="0.3 0.7 0" radius="0.4" radius-tubular="0.08" arc="180" color="#a05a00" rotation="0 90 -60"></a-torus>

      <!-- Nussbecher -->
      <a-cylinder position="0 0.18 0" radius="0.15" height="0.12" color="#8B4513"></a-cylinder>

      <!-- Rätseltext schwebt über der Szene -->
      <a-text
        value="Wie viele Eichhörnchen\nsiehst du hier?"
        position="0 1.8 0"
        align="center"
        color="#fff9c4"
        width="3"
        background-color="#2d6a4f"
        animation="property: position; to: 0 2.1 0; dur: 1500; dir: alternate; loop: true; easing: easeInOutSine"
      ></a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Marker-Hinweis (verschwindet sobald Marker erkannt) -->
  <div id="marker-hint">📋 Halte die Kamera auf<br><strong>Marker 1 (HIRO)</strong></div>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <div id="header">
      <h1>🌳 Posten 1 – Der Baum</h1>
      <p>Schau durch die Kamera auf den Marker!</p>
    </div>
  </div>

  <!-- Rätsel-Box unten -->
  <div id="raetsel-box">
    <h2>🐿️ Rätsel:</h2>
    <p>Schau dir das Eichhörnchen genau an!<br>Wie viele <strong>Nüsse</strong> hält es in der Hand?</p>
    <div class="answer-grid">
      <button class="answer-btn" onclick="checkAnswer(this, false)">1 Nuss</button>
      <button class="answer-btn" onclick="checkAnswer(this, true)">0 Nüsse</button>
      <button class="answer-btn" onclick="checkAnswer(this, false)">3 Nüsse</button>
      <button class="answer-btn" onclick="checkAnswer(this, false)">2 Nüsse</button>
    </div>
  </div>

  <!-- Feedback Overlay -->
  <div id="feedback">
    <div class="emoji" id="feedback-emoji">🎉</div>
    <h2 id="feedback-title">Richtig!</h2>
    <p id="feedback-text">Super gemacht! Das Eichhörnchen hat keine Nüsse!</p>
    <button onclick="hideFeedback()">Weiter ➡️</button>
  </div>

  <script>
    // Marker-Hinweis ausblenden wenn Marker erkannt
    const marker = document.querySelector('#marker1');
    const hint = document.querySelector('#marker-hint');

    marker.addEventListener('markerFound', () => {
      hint.style.display = 'none';
    });
    marker.addEventListener('markerLost', () => {
      hint.style.display = 'block';
    });

    function checkAnswer(btn, correct) {
      const feedback = document.getElementById('feedback');
      if (correct) {
        document.getElementById('feedback-emoji').textContent = '🎉';
        document.getElementById('feedback-title').textContent = 'Richtig!';
        document.getElementById('feedback-text').textContent =
          'Super! Das Eichhörnchen hat gar keine Nüsse – der Becher ist leer!\n\nDer Hinweis für Posten 2: Sucht den nächsten Marker beim großen Stein!';
        feedback.style.background = 'rgba(46,125,50,0.85)';
      } else {
        document.getElementById('feedback-emoji').textContent = '🙈';
        document.getElementById('feedback-title').textContent = 'Nochmal schauen!';
        document.getElementById('feedback-text').textContent =
          'Zählt nochmal genau... schaut auf den Becher!';
        feedback.style.background = 'rgba(183,28,28,0.85)';
        btn.classList.add('wrong');
        setTimeout(() => btn.classList.remove('wrong'), 800);
        return;
      }
      feedback.classList.add('show');
    }

    function hideFeedback() {
      document.getElementById('feedback').classList.remove('show');
    }
  </script>
</body>
</html>
