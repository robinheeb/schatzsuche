<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>🌊 Posten 2 – Der See</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#ui-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 999;
    pointer-events: none;
}

#header {
    background: linear-gradient(135deg,#1565c0,#42a5f5);
    color: white;
    text-align: center;
    padding: 10px;
    pointer-events: all;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
}

#header h1 {
    margin: 0;
    font-size: 1rem;
}

#header p {
    margin: 4px 0 0;
    font-size: 0.8rem;
}

#marker-hint {
    position: fixed;
    top: 22%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 14px 20px;
    border-radius: 14px;
    text-align: center;
    z-index: 500;
}

#raetsel-box {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg,#e3f2fd,#bbdefb);
    border-top: 4px solid #1e88e5;
    padding: 14px;
    z-index: 999;
    max-height: 38vh;
    overflow-y: auto;
}

#raetsel-box h2 {
    margin: 0 0 10px;
    color: #0d47a1;
}

#raetsel-box p {
    margin: 0 0 14px;
    line-height: 1.4;
}

.answer-btn {
    background: #1e88e5;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
}

#feedback {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 2000;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    padding: 30px;
}

#feedback.show {
    display: flex;
}

#feedback .emoji {
    font-size: 5rem;
}

#feedback h2,
#feedback p {
    color: white;
}

#feedback button {
    background: #1e88e5;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px 24px;
    font-size: 1rem;
}
</style>
</head>

<body>

<a-scene
    mindar-image="imageTargetSrc: goldfishTarget.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    xr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

<a-assets>
    <a-asset-item id="goldfish" src="goldfish.glb"></a-asset-item>
    <a-asset-item id="bluefish" src="bluegoldfish.glb"></a-asset-item>
      <a-asset-item id="squirrel"
        src="Squirrel.glb">
    </a-asset-item>
</a-assets>

<a-light type="ambient" intensity="1"></a-light>
<a-light type="directional" intensity="1.2" position="0 2 1"></a-light>

<a-entity id="marker1" mindar-image-target="targetIndex: 0">

    <!-- Goldfisch -->
<a-entity position="0 0.01 0">

    <a-gltf-model
        src="#goldfish"
        scale="0.0002 0.0002 0.0002"
        rotation="0 0 0"
          animation-mixer="clip: Swimming_Normal">
    </a-gltf-model>

</a-entity>

      <a-entity position="0 0.01 0">

    <a-box color="red"
           position="2 0 0"
           width="0.2"
           height="0.2"
           depth="0.2">
    </a-box>

</a-entity>
 
    <!-- Blaue Fische -->
    <a-entity position="0 0.1 0">
        <a-gltf-model src="#bluefish" scale="0.05 0.05 0.05" rotation="0 35 0"  animation-mixer="clip: Fish_Armature|Swimming_Normal"></a-gltf-model>
    </a-entity>
 <a-entity position="0 0.5 0">
        <a-gltf-model src="#bluefish" scale="0.05 0.05 0.05" rotation="0 180 0"  animation-mixer="clip: Fish_Armature|Swimming_Normal"></a-gltf-model>
    </a-entity>
     <a-entity position="0 1.5 0">
        <a-gltf-model src="#goldfish" scale="0.05 0.05 0.05" rotation="0 90 0"  animation-mixer="clip: Fish_Armature|Swimming_Normal"></a-gltf-model>
    </a-entity>

    <a-entity position="1.5 4.5 0">
        <a-gltf-model src="#bluefish" scale="0.003 0.003 0.003"></a-gltf-model>
    </a-entity>

    <a-entity position="3 3 0">
        <a-gltf-model src="#bluefish" scale="0.003 0.003 0.003"></a-gltf-model>
    </a-entity>

    <a-entity position="-2 1 0">
        <a-gltf-model src="#bluefish" scale="0.003 0.003 0.003"></a-gltf-model>
    </a-entity>

    <a-entity position="2 1 0">
        <a-gltf-model src="#bluefish" scale="0.003 0.003 0.003"></a-gltf-model>
    </a-entity>

    <a-entity position="-3 -1 0">
        <a-gltf-model src="#bluefish" scale="0.003 0.003 0.003"></a-gltf-model>
    </a-entity>

    <a-entity position="0 -2 0">
        <a-gltf-model src="#bluefish" scale="0.003 0.003 0.003"></a-gltf-model>
    </a-entity>

    <a-entity position="3 -1 0">
        <a-gltf-model src="#bluefish" scale="0.003 0.003 0.003"></a-gltf-model>
    </a-entity>

</a-entity>

<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

</a-scene>

<div id="marker-hint">
🐟 Halte die Kamera auf das Fischbild
</div>

<div id="ui-overlay">
    <div id="header">
        <h1>🌊 Posten 2 – Der See</h1>
        <p>Finde den besonderen Fisch</p>
    </div>
</div>

<div id="raetsel-box">
    <h2>🐟 Rätsel</h2>

    <p>
        Schau genau ins Wasser!<br>
        Welche Farbe hat der besondere Fisch?
    </p>

    <div style="display:flex; gap:10px;">
        <input
            id="answerInput"
            type="text"
            placeholder="Farbe eingeben"
            style="
                flex:1;
                padding:12px;
                font-size:1rem;
                border-radius:12px;
                border:2px solid #ccc;
            ">

        <button
            id="okButton"
            class="answer-btn"
            onclick="checkAnswer()">
            OK
        </button>
    </div>
</div>

<div id="feedback">
    <div class="emoji" id="feedback-emoji">🎉</div>
    <h2 id="feedback-title"></h2>
    <p id="feedback-text"></p>
    <button onclick="hideFeedback()">Weiter</button>
</div>

<script>

const marker = document.querySelector('#marker1');
const hint = document.querySelector('#marker-hint');

marker.addEventListener("targetFound", () => {
    hint.remove();
}, { once: true });

function checkAnswer() {

    const value =
        document.getElementById('answerInput')
        .value
        .trim()
        .toLowerCase();

    const feedback = document.getElementById('feedback');

    if (!value) {

        document.getElementById('feedback-emoji').textContent = '🤔';
        document.getElementById('feedback-title').textContent = 'Keine Antwort';
        document.getElementById('feedback-text').textContent =
            'Bitte gib eine Farbe ein.';

        feedback.classList.add('show');
        return;
    }

    if (
        value === 'gold' ||
        value === 'golden' ||
        value === 'gelb'
    ) {

        document.getElementById('answerInput').disabled = true;
        document.getElementById('okButton').disabled = true;

        document.getElementById('feedback-emoji').textContent = '🎉';
        document.getElementById('feedback-title').textContent = 'Richtig!';
        document.getElementById('feedback-text').textContent =
            'Super! Du hast den besonderen Goldfisch gefunden. Folge nun dem Weg bis zur grossen Wurzel.';

        feedback.classList.add('show');
    }
    else {

        document.getElementById('feedback-emoji').textContent = '🤔';
        document.getElementById('feedback-title').textContent =
            'Leider nicht ganz richtig';

        document.getElementById('feedback-text').textContent =
            'Schau dir die Fische nochmals genau an.';

        feedback.classList.add('show');
    }
}

function hideFeedback() {
    document.getElementById('feedback').classList.remove('show');
}

document
    .getElementById('answerInput')
    .addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            checkAnswer();
        }
    });

</script>

</body>
</html>
